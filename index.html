<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mentor Hub - Welcome</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 560px;
            width: 100%;
        }
        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 2em;
        }
        h1 a {
            color: inherit;
            text-decoration: none;
        }
        h1 a:hover {
            color: #667eea;
        }
        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 1.1em;
        }
        .links {
            list-style: none;
        }
        .service-block {
            margin-bottom: 22px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .service-title {
            font-size: 1.2rem;
        }
        .section-toggle {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 0;
            border: 0;
            background: none;
            color: #333;
            font: inherit;
            font-weight: 600;
            text-align: left;
            cursor: pointer;
        }
        .section-toggle::before {
            content: "▶";
            font-size: 0.75em;
            transition: transform 0.2s;
        }
        .section-toggle[aria-expanded="true"]::before {
            transform: rotate(90deg);
        }
        .section-content {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .section-content[hidden] {
            display: none;
        }
        .cell-link {
            display: block;
            padding: 12px 20px;
            background: #f5f5f5;
            border-radius: 6px;
            text-decoration: none;
            color: #333;
            transition: background 0.2s, color 0.2s, transform 0.2s;
            border-left: 4px solid #667eea;
            font-size: 14px;
        }
        .cell-link:hover {
            background: #667eea;
            color: white;
            transform: translateX(4px);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1><a href="https://github.com/mentor-forge/mentorhub" id="repo-link" target="_blank" rel="noopener noreferrer">Mentor Hub</a></h1>
        <p class="subtitle">Welcome to the Development Environment</p>

        <ul class="links">
            <li class="service-block">
                <h2 class="service-title">
                    <button class="section-toggle" type="button" aria-expanded="true" aria-controls="app-links">Applications</button>
                </h2>
                <div id="app-links" class="section-content">
                    <a href="#" id="discovery-app-link" class="cell-link" target="_blank" rel="noopener noreferrer">Discovery (default landing)</a>
                    <a href="#" id="customer-app-link" class="cell-link" target="_blank" rel="noopener noreferrer">Customer</a>
                    <a href="#" id="admin-app-link" class="cell-link" target="_blank" rel="noopener noreferrer">Admin</a>
                    <a href="#" id="mentor-app-link" class="cell-link" target="_blank" rel="noopener noreferrer">Mentor</a>
                    <a href="#" id="mentee-app-link" class="cell-link" target="_blank" rel="noopener noreferrer">Mentee</a>
                </div>
            </li>
            <li class="service-block">
                <h2 class="service-title">
                    <button class="section-toggle" type="button" aria-expanded="true" aria-controls="tool-links">Tools</button>
                </h2>
                <div id="tool-links" class="section-content">
                    <a href="#" id="schema-spa-link" class="cell-link" target="_blank" rel="noopener noreferrer">Schema configurator</a>
                    <a href="#" id="runbook-spa-link" class="cell-link" target="_blank" rel="noopener noreferrer">Runbook</a>
                    <a href="#" id="mailhog-link" class="cell-link" target="_blank" rel="noopener noreferrer">MailHog</a>
                    <a href="#" id="stripe-mock-link" class="cell-link" target="_blank" rel="noopener noreferrer">Stripe mock</a>
                    <a href="#" id="cognito-mock-link" class="cell-link" target="_blank" rel="noopener noreferrer">Cognito mock</a>
                    <a href="#" id="stage0-launch-link" class="cell-link" target="_blank" rel="noopener noreferrer">Stage0 Launch</a>
                </div>
            </li>
            <li class="service-block">
                <h2 class="service-title">
                    <button class="section-toggle" type="button" aria-expanded="false" aria-controls="api-links">API Explorer</button>
                </h2>
                <div id="api-links" class="section-content" hidden>
                    <a href="#" id="schema-api-docs-link" class="cell-link" target="_blank" rel="noopener noreferrer" title="Open API docs">Schema API</a>
                    <a href="#" id="customer-api-docs-link" class="cell-link" target="_blank" rel="noopener noreferrer" title="Open API docs">Customer API</a>
                    <a href="#" id="admin-api-docs-link" class="cell-link" target="_blank" rel="noopener noreferrer" title="Open API docs">Admin API</a>
                    <a href="#" id="mentor-api-docs-link" class="cell-link" target="_blank" rel="noopener noreferrer" title="Open API docs">Mentor API</a>
                    <a href="#" id="mentee-api-docs-link" class="cell-link" target="_blank" rel="noopener noreferrer" title="Open API docs">Mentee API</a>
                    <a href="#" id="discovery-api-docs-link" class="cell-link" target="_blank" rel="noopener noreferrer" title="Open API docs">Discovery API</a>
                    <a href="#" id="runbook-api-docs-link" class="cell-link" target="_blank" rel="noopener noreferrer" title="Open API docs">Runbook API</a>
                </div>
            </li>
        </ul>
    </div>
    <script>
        const hostname = window.location.hostname || 'localhost';

        document.getElementById('discovery-app-link').href = `http://${hostname}:8080/discovery/`;
        document.getElementById('customer-app-link').href = `http://${hostname}:8080/customer/`;
        document.getElementById('admin-app-link').href = `http://${hostname}:8080/admin/`;
        document.getElementById('mentor-app-link').href = `http://${hostname}:8080/mentor/`;
        document.getElementById('mentee-app-link').href = `http://${hostname}:8080/mentee/`;

        document.getElementById('schema-spa-link').href = `http://${hostname}:8384/`;
        document.getElementById('runbook-spa-link').href = `http://${hostname}:8396/`;
        document.getElementById('mailhog-link').href = `http://${hostname}:8025/`;
        document.getElementById('stripe-mock-link').href = `http://${hostname}:12111/`;
        document.getElementById('cognito-mock-link').href = `http://${hostname}:9229/`;
        document.getElementById('stage0-launch-link').href = `http://${hostname}:8081/`;

        document.getElementById('schema-api-docs-link').href = `http://${hostname}:8383/docs/index.html`;
        document.getElementById('customer-api-docs-link').href = `http://${hostname}:8387/docs/explorer.html`;
        document.getElementById('admin-api-docs-link').href = `http://${hostname}:8389/docs/explorer.html`;
        document.getElementById('mentor-api-docs-link').href = `http://${hostname}:8391/docs/explorer.html`;
        document.getElementById('mentee-api-docs-link').href = `http://${hostname}:8393/docs/explorer.html`;
        document.getElementById('discovery-api-docs-link').href = `http://${hostname}:8397/docs/explorer.html`;
        document.getElementById('runbook-api-docs-link').href = `http://${hostname}:8395/docs/explorer.html`;

        document.querySelectorAll('.section-toggle').forEach((toggle) => {
            toggle.addEventListener('click', () => {
                const section = document.getElementById(toggle.getAttribute('aria-controls'));
                const expanded = toggle.getAttribute('aria-expanded') === 'true';

                toggle.setAttribute('aria-expanded', String(!expanded));
                section.hidden = expanded;
            });
        });
    </script>
</body>
</html>
