server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    # Keep the published :8080 port on trailing-slash redirects (otherwise
    # Location: http://localhost/discovery/ drops the port and misses welcome).
    absolute_redirect off;

    resolver 127.0.0.11 valid=10s ipv6=off;

    location = /discovery { return 302 /discovery/; }
    location = /customer { return 302 /customer/; }
    location = /admin { return 302 /admin/; }
    location = /mentor { return 302 /mentor/; }
    location = /mentee { return 302 /mentee/; }

    location /discovery/ {
        set $upstream http://discovery_spa:80;
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /discovery;
        proxy_cache_bypass $http_upgrade;
    }

    location /customer/ {
        set $upstream http://customer_spa:80;
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /customer;
        proxy_cache_bypass $http_upgrade;
    }

    location /admin/ {
        set $upstream http://admin_spa:80;
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /admin;
        proxy_cache_bypass $http_upgrade;
    }

    location /mentor/ {
        set $upstream http://mentor_spa:80;
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /mentor;
        proxy_cache_bypass $http_upgrade;
    }

    location /mentee/ {
        set $upstream http://mentee_spa:80;
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /mentee;
        proxy_cache_bypass $http_upgrade;
    }

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
}
