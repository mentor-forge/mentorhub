# docker-compose.yaml for Mentor Hub developers edition
services:
  ##################################
  # Welcome Service
  ##################################
  welcome:
    image: ghcr.io/mentor-forge/mentorhub:latest
    ports:
      - "0.0.0.0:8080:80"
    profiles:
      - all
      - mongodb
      - customer
      - customer-api
      - coordinator
      - coordinator-api
      - mentor
      - mentor-api
      - mentee
      - mentee-api

  ##################################
  # Backing Services
  ##################################
  # SECURITY (Developer Edition only): all ports bind to 0.0.0.0 so the stack is
  # reachable over the team Tailscale VPN. MongoDB runs with --bind_ip_all and NO
  # authentication, so tailnet ACLs are the only access control. Never use these
  # bindings outside local / tailnet development. See CONTRIBUTING.md (VPN access).
  mongodb:
    image: mongo:7.0.5
    ports:
      - "0.0.0.0:27017:27017"
    extra_hosts:
      - "mongodb:127.0.0.1"
    healthcheck:
      test: echo "db.runCommand('ping')" | mongosh --port 27017 --quiet
      interval: 5s
      timeout: 30s
      start_period: 0s
      retries: 3
    command: ["--bind_ip_all", "--port", "27017"]
    profiles:
      - all
      - mongodb
      - customer
      - customer-api
      - coordinator
      - coordinator-api
      - mentor
      - mentor-api
      - mentee
      - mentee-api

  ##################################
  # Mongo Database Configuration Utilities
  ##################################
  mongodb_api:
    image: ghcr.io/mentor-forge/mentorhub_mongodb_api:latest
    restart: no
    ports:
      - "0.0.0.0:8383:8383"
    environment:
      MONGO_CONNECTION_STRING: mongodb://mongodb:27017/
      MONGODB_REQUIRE_TLS: False
      MONGO_DB_NAME: mentor_hub
      AUTO_PROCESS: True
      LOAD_TEST_DATA: True
      API_PORT: 8383
      SPA_PORT: 8384
      UI_HEADER: "Mentor Hub Schemas"
    depends_on:
      mongodb:
        condition: service_healthy
    profiles:
      - all
      - mongodb
      - customer
      - customer-api
      - coordinator
      - coordinator-api
      - mentor
      - mentor-api
      - mentee
      - mentee-api

  mongodb_spa:
    # spa_ref (configurator_spa): fixed utility image, not mentorhub_…
    image: ghcr.io/agile-learning-institute/mongodb_configurator_spa:latest
    restart: no
    ports:
      - "0.0.0.0:8384:8384"
    environment:
      API_HOST: mongodb_api
      API_PORT: 8383
      SPA_PORT: 8384
    depends_on:
      mongodb_api:
        condition: service_started
    profiles:
      - all
      - mongodb
      - customer
      - customer-api
      - coordinator
      - coordinator-api
      - mentor
      - mentor-api
      - mentee
      - mentee-api

  ##################################
  # Microservice domains (from architecture)
  ##################################
  customer_api:
    image: ghcr.io/mentor-forge/mentorhub_customer_api:latest
    restart: no
    ports:
      - "0.0.0.0:8387:8387"
    environment:
      MONGO_CONNECTION_STRING: mongodb://mongodb:27017/
      MONGODB_REQUIRE_TLS: False
      MONGO_DB_NAME: mentor_hub
      LOGGING_LEVEL: "INFO"
      JWT_SECRET: ${JWT_SECRET:-local-dev-jwt-secret-fixed}
      JWT_ISSUER: ${JWT_ISSUER:-dev-idp}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-dev-api}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      API_PORT: 8387
      SAMPLE_API_PORT: 8387
      SAMPLE_SPA_PORT: 8388
      # Local dev mocks — Research/local_dev_mocks.md (locked L2, L4, L7, L8)
      COGNITO_ENABLED: ${COGNITO_ENABLED:-false}
      REGISTRATION_DEV_MODE: ${REGISTRATION_DEV_MODE:-true}
      STRIPE_API_BASE: ${STRIPE_API_BASE:-http://mock_stripe_api:12111}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-sk_test_local_dev}
      STRIPE_WEBHOOK_VERIFY: ${STRIPE_WEBHOOK_VERIFY:-false}
    depends_on:
      mongodb_api:
        condition: service_started
    profiles:
      - all
      - customer
      - customer-api

  mock_stripe_api:
    image: stripe/stripe-mock:latest
    restart: no
    ports:
      - "0.0.0.0:12111:12111"
    profiles:
      - all
      - customer-api
      - customer

# stripe-mock: Research/local_dev_mocks.md

  customer_spa:
    image: ghcr.io/mentor-forge/mentorhub_customer_spa:latest
    restart: no
    ports:
      - "0.0.0.0:8388:80"
    environment:
      API_HOST: customer_api
      API_PORT: 8387
      IDP_LOGIN_URI: ${IDP_LOGIN_URI:-http://127.0.0.1:8080/login.html}
    depends_on:
      customer_api:
        condition: service_started
    profiles:
      - all
      - customer

  coordinator_api:
    image: ghcr.io/mentor-forge/mentorhub_coordinator_api:latest
    restart: no
    ports:
      - "0.0.0.0:8389:8389"
    environment:
      MONGO_CONNECTION_STRING: mongodb://mongodb:27017/
      MONGODB_REQUIRE_TLS: False
      MONGO_DB_NAME: mentor_hub
      LOGGING_LEVEL: "INFO"
      JWT_SECRET: ${JWT_SECRET:-local-dev-jwt-secret-fixed}
      API_PORT: 8389
      SAMPLE_API_PORT: 8389
      SAMPLE_SPA_PORT: 8390
    depends_on:
      mongodb_api:
        condition: service_started
    profiles:
      - all
      - coordinator
      - coordinator-api

  coordinator_spa:
    image: ghcr.io/mentor-forge/mentorhub_coordinator_spa:latest
    restart: no
    ports:
      - "0.0.0.0:8390:80"
    environment:
      API_HOST: coordinator_api
      API_PORT: 8389
      IDP_LOGIN_URI: ${IDP_LOGIN_URI:-http://127.0.0.1:8080/login.html}
    depends_on:
      coordinator_api:
        condition: service_started
    profiles:
      - all
      - coordinator

  mentor_api:
    image: ghcr.io/mentor-forge/mentorhub_mentor_api:latest
    restart: no
    ports:
      - "0.0.0.0:8391:8391"
    environment:
      MONGO_CONNECTION_STRING: mongodb://mongodb:27017/
      MONGODB_REQUIRE_TLS: False
      MONGO_DB_NAME: mentor_hub
      LOGGING_LEVEL: "INFO"
      JWT_SECRET: ${JWT_SECRET:-local-dev-jwt-secret-fixed}
      API_PORT: 8391
      SAMPLE_API_PORT: 8391
      SAMPLE_SPA_PORT: 8392
    depends_on:
      mongodb_api:
        condition: service_started
    profiles:
      - all
      - mentor
      - mentor-api

  mentor_spa:
    image: ghcr.io/mentor-forge/mentorhub_mentor_spa:latest
    restart: no
    ports:
      - "0.0.0.0:8392:80"
    environment:
      API_HOST: mentor_api
      API_PORT: 8391
      IDP_LOGIN_URI: ${IDP_LOGIN_URI:-http://127.0.0.1:8080/login.html}
    depends_on:
      mentor_api:
        condition: service_started
    profiles:
      - all
      - mentor

  mentee_api:
    image: ghcr.io/mentor-forge/mentorhub_mentee_api:latest
    restart: no
    ports:
      - "0.0.0.0:8393:8393"
    environment:
      MONGO_CONNECTION_STRING: mongodb://mongodb:27017/
      MONGODB_REQUIRE_TLS: False
      MONGO_DB_NAME: mentor_hub
      LOGGING_LEVEL: "INFO"
      JWT_SECRET: ${JWT_SECRET:-local-dev-jwt-secret-fixed}
      API_PORT: 8393
      SAMPLE_API_PORT: 8393
      SAMPLE_SPA_PORT: 8394
    depends_on:
      mongodb_api:
        condition: service_started
    profiles:
      - all
      - mentee
      - mentee-api

  mentee_spa:
    image: ghcr.io/mentor-forge/mentorhub_mentee_spa:latest
    restart: no
    ports:
      - "0.0.0.0:8394:80"
    environment:
      API_HOST: mentee_api
      API_PORT: 8393
      IDP_LOGIN_URI: ${IDP_LOGIN_URI:-http://127.0.0.1:8080/login.html}
    depends_on:
      mentee_api:
        condition: service_started
    profiles:
      - all
      - mentee