architecture:
  organization: Agile Learning Institute
  product: Mentor Hub
  platform:
    repo: mentor-forge/mentorhub_cloudformation
    overview: https://github.com/mentor-forge/mentorhub_cloudformation/blob/main/README.md
    architecture: https://github.com/mentor-forge/mentorhub_cloudformation/blob/main/ARCHITECTURE.md
    config: https://github.com/mentor-forge/mentorhub_cloudformation/blob/main/config/aws-platform.yaml
    note: AWS accounts, infrastructure services, deployment topology, and as-built platform values live in mentorhub_cloudformation.
  journey-domains:
    - name: schema
      description: MongoDB Database Configuration and Management.
      repos:
        - name: mongodb_api
          description: MongoDB Configurator API Server
          template: agile-learning-institute/stage0_template_configurator_api
          publish: make
          type: api
          port: 8383
        - name: configurator_spa
          description: MongoDB Configurator SPA (utility container, not a real repository)
          type: spa_ref
          port: 8384
    - name: common_code
      description: Shared code used across multiple API or SPA code bases are published to private dependency management libraries (NPM /PYPI).
      repos:
        - name: api_utils
          description: Python PyPI API Utility Library
          template: agile-learning-institute/stage0_template_py_utils
          publish: pipenv
          type: api
          port: 8385
        - name: spa_utils
          description: Vue NPM SPA Utility Library
          template: agile-learning-institute/stage0_template_vue_utils
          publish: npm
          type: spa
          port: 8386
    - name: customer
      description: The Customer User Journey is responsible for managing customers and their interactions with the system.
      is_journey: true
      data_domains:
        controls:
          - Customer
          - Payment
          - Profile
        creates:
          - Event
        consumes: 
          - Journey
          - Rating
          - Note
      repos:
        - name: customer_api
          description: Customer API
          template: agile-learning-institute/stage0_template_flask_mongo
          publish: pipenv
          type: api
          port: 8387
        - name: customer_spa
          description: Customer SPA
          template: agile-learning-institute/stage0_template_vue_vuetify
          publish: npm
          type: spa
          port: 8388
    - name: admin
      description: Platform operators and ingress automation (Stripe, Cognito, external webhooks).
      is_journey: true
      data_domains:
        controls:
          - ExternalEvent
          - Setting
        creates:
           - Event
           - Profile
        consumes:
          - Profile
          - Customer
      repos:
        - name: admin_api
          description: Admin API
          template: agile-learning-institute/stage0_template_flask_mongo
          publish: pipenv
          type: api
          port: 8389
        - name: admin_spa
          description: Admin SPA
          template: agile-learning-institute/stage0_template_vue_vuetify
          publish: npm
          type: spa
          port: 8390
    - name: discovery
      description: Universal landing, notifications UX, and cross-SPA discovery.
      is_journey: true
      data_domains:
        controls:
          - Notification
        creates: 
          - Event
        consumes:
          - Profile
          - Customer
          - Journey
          - Resource
          - Path
          - Plan
      repos:
        - name: discovery_api
          description: Discovery API
          template: agile-learning-institute/stage0_template_flask_mongo
          publish: pipenv
          type: api
          port: 8397
        - name: discovery_spa
          description: Discovery SPA
          template: agile-learning-institute/stage0_template_vue_vuetify
          publish: npm
          type: spa
          port: 8398
    - name: mentor
      description: Mentor User Journey Domain
      is_journey: true
      data_domains:
        controls:
          - Resource
          - Path
          - Plan
          - Encounter
        creates:
          - Event
        consumes:
          - Profile
      repos:
        - name: mentor_api
          description: Mentor API
          template: agile-learning-institute/stage0_template_flask_mongo
          publish: pipenv
          type: api
          port: 8391
        - name: mentor_spa
          description: Mentor SPA
          template: agile-learning-institute/stage0_template_vue_vuetify
          publish: npm
          type: spa
          port: 8392
    - name: mentee
      description: Mentee User Journey Domain
      is_journey: true
      data_domains:
        controls:
          - Journey
          - Rating
          - Note
        creates:
          - Event
        consumes:
          - Resource
          - Path 
      repos:
        - name: mentee_api
          description: Mentee API
          template: agile-learning-institute/stage0_template_flask_mongo
          publish: pipenv
          type: api
          port: 8393 
        - name: mentee_spa
          description: Mentee SPA
          template: agile-learning-institute/stage0_template_vue_vuetify
          publish: npm
          type: spa
          port: 8394                  
    - name: runbook
      description: Runbook Automation
      repos:
        - name: runbook_api
          description: Runbook Automation API Server
          template: agile-learning-institute/stage0_template_runbook_api
          publish: make
          type: api
          port: 8395
        - name: runbook_spa
          description: Runbook Automation SPA (utility container, not a real repository)
          type: spa_ref
          port: 8396
